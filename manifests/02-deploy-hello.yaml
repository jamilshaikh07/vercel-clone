---
# Templated deployment for the "user app" built by Kaniko.
# The control plane will eventually generate these three resources
# (Deployment + Service + IngressRoute) per deploy. This file is the
# manual reference implementation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-hello
  namespace: paas-deployments
  labels:
    app: sample-hello
    paas.jamilshaikh.in/project: sample-hello
    paas.jamilshaikh.in/deploy-id: manual-001
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-hello
  template:
    metadata:
      labels:
        app: sample-hello
        paas.jamilshaikh.in/project: sample-hello
        paas.jamilshaikh.in/deploy-id: manual-001
    spec:
      containers:
        - name: app
          image: ttl.sh/jamilshaikh-paas-hello-f800b07b:24h
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sample-hello
  namespace: paas-deployments
spec:
  selector:
    app: sample-hello
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sample-hello
  namespace: paas-deployments
  annotations:
    external-dns.alpha.kubernetes.io/target: "3a067db9-77b1-49c9-a3d4-30f86d16c80d.cfargotunnel.com"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sample-paas.jamilshaikh.in`)
      kind: Rule
      services:
        - name: sample-hello
          port: 80
