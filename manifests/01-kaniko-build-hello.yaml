---
# Manual Kaniko build of the sample hello-app, pushed to ttl.sh.
# This is the "build half" of the PaaS pipeline that the control plane
# will later automate. Kaniko clones the git context, builds the Dockerfile,
# and pushes the resulting image — all rootless, no Docker daemon, Talos-safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-hello
  namespace: paas-system
  labels:
    app.kubernetes.io/component: builder
    app.kubernetes.io/part-of: paas
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: builder
    spec:
      restartPolicy: Never
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=git://github.com/jamilshaikh07/paas-sample-hello.git#refs/heads/main
            - --dockerfile=Dockerfile
            - --destination=ttl.sh/jamilshaikh-paas-hello-f800b07b:24h
            - --snapshot-mode=redo
            - --use-new-run
            - --cache=false
            - --verbosity=info
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
