---
# In-cluster Docker registry v2 with MinIO (S3) backend.
#
# Exposure model matches the rest of the cluster: in-cluster HTTP,
# public HTTPS terminated at Cloudflare. Both Kaniko (push) and the
# kubelet (pull) reach the registry via registry.jamilshaikh.in. The
# round trip out-and-back through the tunnel adds ~100ms — acceptable
# for MVP and avoids the Talos containerd-trust-store yak shave.
#
# Two Secrets are NOT in this file (they hold credentials):
#   - registry-auth      htpasswd file for the registry to validate basic auth
#   - registry-dockercfg dockerconfigjson used both by Kaniko (mounted at
#                        /kaniko/.docker/config.json) and tenant pods
#                        (referenced via imagePullSecrets)
# They are generated by `tools/setup-registry` and applied imperatively.
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: paas-system
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
      accesslog:
        disabled: true
    storage:
      s3:
        regionendpoint: http://minio.minio-system.svc.cluster.local:9000
        region: us-east-1
        bucket: paas-registry
        secure: false
        forcepathstyle: true
        v4auth: true
      delete:
        enabled: true
      redirect:
        # Registry proxies blob downloads through itself instead of issuing
        # presigned-URL redirects to MinIO. Required because kubelet on the
        # nodes can't resolve cluster-internal DNS (minio.minio-system.svc).
        disable: true
      maintenance:
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
        readonly:
          enabled: false
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    auth:
      htpasswd:
        realm: paas-registry
        path: /auth/htpasswd
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: paas-system
  labels:
    app: registry
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/component: registry
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: registry-s3
                  key: access-key
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: registry-s3
                  key: secret-key
          volumeMounts:
            - name: config
              mountPath: /etc/docker/registry
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: registry-config
        - name: auth
          secret:
            secretName: registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: paas-system
spec:
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry
  namespace: paas-system
  annotations:
    external-dns.alpha.kubernetes.io/target: 3a067db9-77b1-49c9-a3d4-30f86d16c80d.cfargotunnel.com
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`registry.jamilshaikh.in`)
      services:
        - name: registry
          port: 5000
