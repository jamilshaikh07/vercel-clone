---
# Control plane Deployment + Service + IngressRoute.
# The Secret github-webhook is created out-of-band (not committed to git)
# via:  kubectl -n paas-system create secret generic github-webhook \
#           --from-literal=secret=$(openssl rand -hex 32)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: paas-system
  labels:
    app: control-plane
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: paas
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
        app.kubernetes.io/component: control-plane
    spec:
      containers:
        - name: control-plane
          image: ttl.sh/jamilshaikh-paas-control-plane-37e826b9:24h
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-webhook
                  key: secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paas-db-app
                  key: uri
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: paas-system
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: control-plane
  namespace: paas-system
  annotations:
    external-dns.alpha.kubernetes.io/target: "3a067db9-77b1-49c9-a3d4-30f86d16c80d.cfargotunnel.com"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`paas.jamilshaikh.in`)
      kind: Rule
      services:
        - name: control-plane
          port: 80
