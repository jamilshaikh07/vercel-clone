---
# Control plane Deployment + Service + IngressRoute.
# The Secret github-webhook is created out-of-band (not committed to git)
# via:  kubectl -n paas-system create secret generic github-webhook \
#           --from-literal=secret=$(openssl rand -hex 32)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: paas-system
  labels:
    app: control-plane
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: paas
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: control-plane
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.96.0.10
        searches:
          - paas-system.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      # Pull the self-built image from the in-cluster, MinIO-backed registry
      # via its public HTTPS endpoint. registry-dockercfg holds the creds.
      imagePullSecrets:
        - name: registry-dockercfg
      securityContext:
        # The projected Secret files are owned by root:fsGroup; fsGroup=65532
        # matches the distroless nonroot uid/gid so defaultMode 0440 is readable.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: control-plane
          image: registry.spinup.in/spinup-control-plane:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-webhook
                  key: secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paas-db-app
                  key: uri
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: app-id
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /etc/github-app/private-key.pem
            # Dashboard OAuth — App credentials live in the same App as the
            # webhook/clone-token issuer, just exposed via OAuth on the side.
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-oauth
                  key: client-id
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-app-oauth
                  key: client-secret
            # 32+ bytes used to (a) HMAC session tokens before storing them
            # and (b) sign OAuth state cookies. Rotating it logs everyone out.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-app-oauth
                  key: session-secret
            - name: DASHBOARD_BASE_URL
              value: https://app.spinup.in
            - name: MARKETING_HOSTS
              value: "spinup.in,www.spinup.in"
            - name: APP_HOSTS
              value: "app.spinup.in"
            - name: MAX_PROJECTS_PER_USER
              value: "15"
            # Pre-launch abuse guardrail: invite-only sign-in. Only these
            # GitHub logins can complete login; everyone else hits the
            # waitlist screen and never gets a session or tenant namespace.
            # Comma/space separated. Leave EMPTY to disable (open signup).
            # Edit + `kubectl rollout restart deploy/control-plane` to update.
            - name: ALLOWED_GH_LOGINS
              value: "jamilshaikh07"
            # Superuser connection for the tenant-DB provisioner. Only
            # used by db_provisioner.go — never by the app data path.
            - name: PG_SUPERUSER_URI
              valueFrom:
                secretKeyRef:
                  name: paas-db-superuser
                  key: uri
          volumeMounts:
            - name: github-app-key
              mountPath: /etc/github-app
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: github-app-key
          secret:
            secretName: github-app
            items:
              - key: private-key.pem
                path: private-key.pem
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: paas-system
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: control-plane
  namespace: paas-system
  annotations:
    external-dns.alpha.kubernetes.io/target: "3a067db9-77b1-49c9-a3d4-30f86d16c80d.cfargotunnel.com"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`spinup.in`) || Host(`www.spinup.in`) || Host(`app.spinup.in`)
      kind: Rule
      services:
        - name: control-plane
          port: 80
