---
# Postgres for the control plane.
# Single-instance MVP. We can scale to 3 with sync replicas later without
# changing app-side connection logic (CNPG's -rw service abstracts failover).
#
# Secrets auto-created by CNPG:
#   paas-db-app         (role 'app', database 'paas')   ← used by control-plane
#   paas-db-superuser   (role 'postgres')               ← admin
#
# Connection service: paas-db-rw.paas-system.svc.cluster.local:5432
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paas-db
  namespace: paas-system
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  # Mint the paas-db-superuser Secret. The control plane uses it to
  # provision per-project tenant databases (CREATE ROLE / CREATE DB).
  # The 'app' user is intentionally NOT a superuser.
  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: paas
      owner: app
      # gen_random_uuid() lives in pgcrypto on older PG; in 16 it's built-in
      # via the pgcrypto extension which we enable to be safe.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;

  storage:
    size: 5Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  monitoring:
    enablePodMonitor: false

  # --- Off-box backups to TrueNAS (10.20.0.45) -------------------------
  # Continuous WAL archiving + scheduled base backups give us point-in-time
  # recovery. The target is an S3 bucket served by the MinIO app on the
  # TrueNAS host — a SEPARATE machine from this cluster, so a node/disk loss
  # here doesn't take the backups with it.
  #
  # Credentials live in the Secret 'paas-db-backup-s3' (NOT committed — see
  # manifests/08-paas-db-backup.yaml header for how to create it).
  #
  # Once this is applied, CNPG sets archive_command automatically and starts
  # streaming WAL; the ScheduledBackup in manifest 08 takes the base backups.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://paas-db-backups/"
      # MinIO custom app on the TrueNAS host (10.20.0.45). S3 API is mapped
      # to host port 9900 (console on 9901). Plain HTTP is fine over the LAN.
      endpointURL: "http://10.20.0.45:9900"
      s3Credentials:
        accessKeyId:
          name: paas-db-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: paas-db-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
