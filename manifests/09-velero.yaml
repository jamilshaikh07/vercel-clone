---
# Velero — full cluster-resource DR to the TrueNAS MinIO (10.20.0.45)
# =====================================================================
# Velero backs up every Kubernetes API object (Deployments, Services,
# IngressRoutes, Secrets, ConfigMaps, CRs, RBAC, ...) cluster-wide so the
# whole platform can be rebuilt onto a fresh cluster. It complements the
# two other layers:
#   * paas-db (CNPG) -> its own PITR object store  (manifests 05 + 08)
#   * tenant app images -> rebuildable from git via the in-cluster registry
# so Velero deliberately does NOT snapshot volumes (storage is local-path,
# no CSI snapshots; the only stateful crown jewel, Postgres, is covered by
# CNPG). node-agent / FS backup can be added later if we need PV data.
#
# ---------------------------------------------------------------------
# INSTALL (imperative, via the Velero CLI — run once per cluster):
#
#   cat > /tmp/credentials-velero <<EOF
#   [default]
#   aws_access_key_id=<minio key>
#   aws_secret_access_key=<minio secret>
#   EOF
#
#   velero install \
#     --provider aws \
#     --plugins velero/velero-plugin-for-aws:v1.14.0 \
#     --bucket velero \
#     --secret-file /tmp/credentials-velero \
#     --use-volume-snapshots=false \
#     --backup-location-config region=us-east-1,s3ForcePathStyle=true,s3Url=http://10.20.0.45:9900 \
#     --wait
#
# The S3 creds land in Secret velero/cloud-credentials (NOT committed).
# Verify:  kubectl -n velero get backupstoragelocation default  -> Available
#
# ---------------------------------------------------------------------
# RESTORE / DISASTER RECOVERY:
#   velero backup get                              # list restore points
#   velero restore create --from-backup daily-full-<timestamp>
#   velero restore describe <name> --details
# On a brand-new cluster: re-run the install above (same bucket) so Velero
# re-syncs the existing backups from the object store, then restore.
# (Restore the paas-db Cluster from its OWN object store — see manifest 08 —
#  not from Velero, since Velero skips the Postgres PV data.)
#
# This Schedule is the one declarative piece worth tracking in git; the
# rest of the install is generated by the CLI above.
# =====================================================================
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-full
  namespace: velero
spec:
  # Daily at 02:30 — just after the paas-db base backup (02:00) so a given
  # night's DB snapshot and cluster-resource snapshot are close in time.
  schedule: "30 2 * * *"
  template:
    # Retain each backup for 30 days, matching the DB retention policy.
    ttl: 720h0m0s
    # No namespace filter => every namespace. Volumes are intentionally not
    # captured (see header).
    storageLocation: default
    defaultVolumesToFsBackup: false
