<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>paas — dashboard</title>
  <style>
    :root {
      --bg: #0b0d11;
      --panel: #14171d;
      --panel-2: #1c2027;
      --border: #262b34;
      --text: #e6e8eb;
      --text-dim: #9aa1ad;
      --accent: #7aa2f7;
      --ok: #2ecc71;
      --warn: #f1c40f;
      --err: #ff6b6b;
      --building: #5bc0de;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .app {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 56px 1fr;
      grid-template-areas:
        "header header"
        "projects logs";
      height: 100vh;
    }
    header {
      grid-area: header;
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); }
    header .spacer { flex: 1; }
    header .meta { color: var(--text-dim); font-size: 12px; }
    header .me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
    header .me img { width: 24px; height: 24px; border-radius: 50%; }
    header .signout {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    }
    header .signout:hover { color: var(--text); border-color: var(--accent); }
    .install-cta {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 24px; text-align: center;
      margin-bottom: 16px;
    }
    .install-cta h3 { margin: 0 0 8px; font-size: 16px; }
    .install-cta p { color: var(--text-dim); margin: 0 0 16px; font-size: 13px; }
    .install-cta a.btn {
      display: inline-block; background: var(--accent); color: #14171d;
      padding: 8px 18px; border-radius: 6px; font-weight: 600; font-size: 13px;
    }
    .install-cta a.btn:hover { text-decoration: none; opacity: 0.9; }
    main {
      grid-area: projects;
      overflow-y: auto;
      padding: 16px 24px;
      border-right: 1px solid var(--border);
    }
    aside {
      grid-area: logs;
      display: flex; flex-direction: column;
      overflow: hidden;
      background: var(--panel);
    }
    /* Workspace = per-project right pane: storage + SQL on top. */
    .ws-empty {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-style: italic; font-size: 13px;
      text-align: center; padding: 24px;
    }
    .ws {
      display: none; flex-direction: column;
      flex: 1; min-height: 0;
    }
    .ws.active { display: flex; }
    .ws-head {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .ws-head .slug { font-weight: 600; font-size: 13px; }
    .ws-head .repo { color: var(--text-dim); font-size: 12px; }
    .ws-head .spacer { flex: 1; }
    .ws-head button {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .ws-head button:hover { color: var(--text); border-color: var(--accent); }
    /* Storage row inside workspace — flatter than the old inline version. */
    .ws-storage {
      padding: 8px 16px; font-size: 12px; color: var(--text-dim);
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .ws-storage .label {
      text-transform: uppercase; letter-spacing: 0.06em;
      font-size: 10px; font-weight: 600; color: var(--text-dim);
    }
    .ws-storage .pill {
      font-family: ui-monospace, monospace;
      padding: 2px 8px; border-radius: 6px;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    }
    .ws-storage .btn-add {
      background: transparent; border: 1px dashed var(--border); color: var(--text-dim);
      padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .ws-storage .btn-add:hover { color: var(--text); border-color: var(--accent); border-style: solid; }
    .ws-storage .btn-add[disabled] { opacity: 0.5; cursor: progress; }
    .ws-storage .copy, .ws-storage .reveal {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 2px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    .ws-storage .copy:hover, .ws-storage .reveal:hover { color: var(--text); border-color: var(--accent); }
    .ws-storage .err { color: var(--err); }
    /* Query editor area — flexes to fill remaining space above logs. */
    .ws-query {
      display: none; flex-direction: column;
      flex: 1; min-height: 0;
      border-bottom: 1px solid var(--border);
    }
    .ws-query.active { display: flex; }
    .ws-query .editor {
      padding: 10px 16px;
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
    }
    .ws-query textarea {
      width: 100%; min-height: 70px; resize: vertical; max-height: 200px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px;
      font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5;
    }
    .ws-query textarea:focus { outline: none; border-color: var(--accent); }
    .ws-query .run {
      background: var(--accent); color: #14171d; border: none;
      padding: 6px 16px; border-radius: 6px; font-size: 12px; cursor: pointer;
      align-self: start; font-weight: 600;
    }
    .ws-query .run[disabled] { opacity: 0.5; cursor: progress; }
    .ws-query .run:hover:not([disabled]) { filter: brightness(1.15); }
    .ws-query .result {
      flex: 1; min-height: 0;
      overflow: auto;
      padding: 0 16px 12px;
      font-size: 11px; color: var(--text-dim);
      font-family: ui-monospace, monospace;
    }
    .ws-query .result .meta { padding: 4px 0 8px; }
    .ws-query .result .meta .ok  { color: var(--ok); }
    .ws-query .result .meta .err { color: var(--err); }
    .ws-query .result table {
      width: 100%; border-collapse: collapse;
      background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .ws-query .result th, .ws-query .result td {
      padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis;
    }
    .ws-query .result th {
      background: var(--panel); color: var(--text-dim);
      font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .ws-query .result td.num { text-align: right; }
    .ws-query .result tr:last-child td { border-bottom: none; }
    .ws-query .result .null { color: var(--text-dim); font-style: italic; }
    .project {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      background: var(--panel);
    }
    .project-head {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .project-head .slug { font-weight: 600; font-size: 14px; }
    .project-head .repo { color: var(--text-dim); font-size: 12px; }
    .project-head .branch {
      font-size: 11px;
      color: var(--text-dim);
      padding: 2px 8px; border: 1px solid var(--border); border-radius: 20px;
    }
    .project-head .prod-link {
      margin-left: auto;
      font-size: 12px; color: var(--ok); font-family: ui-monospace, monospace;
      padding: 2px 10px; border: 1px solid rgba(46, 204, 113, 0.4);
      border-radius: 20px;
    }
    .project-head .prod-link:hover { background: rgba(46, 204, 113, 0.1); text-decoration: none; }
    /* Storage panel — per-project Postgres binding ("Add Database"). */
    .storage {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-dim);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .storage .label {
      text-transform: uppercase; letter-spacing: 0.06em;
      font-size: 10px; font-weight: 600; color: var(--text-dim);
    }
    .storage .pill {
      font-family: ui-monospace, monospace;
      padding: 2px 8px; border-radius: 6px;
      background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text);
    }
    .storage .btn-add {
      background: transparent; border: 1px dashed var(--border); color: var(--text-dim);
      padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .storage .btn-add:hover { color: var(--text); border-color: var(--accent); border-style: solid; }
    .storage .btn-add[disabled] { opacity: 0.5; cursor: progress; }
    .storage .copy {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 2px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    .storage .copy:hover { color: var(--text); border-color: var(--accent); }
    .storage .reveal {
      background: transparent; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 11px; padding: 0 4px;
    }
    .storage .reveal:hover { color: var(--text); }
    .storage .err { color: var(--err); }

    /* SQL console — collapsible per project, sits between storage panel and deployments. */
    .sql-panel {
      display: none;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
    }
    .sql-panel.open { display: block; }
    .sql-panel .editor {
      padding: 10px 16px;
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
    }
    .sql-panel textarea {
      width: 100%; min-height: 80px; resize: vertical;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px;
      font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5;
    }
    .sql-panel textarea:focus { outline: none; border-color: var(--accent); }
    .sql-panel .run {
      background: var(--accent); color: #fff; border: none;
      padding: 6px 16px; border-radius: 6px; font-size: 12px; cursor: pointer;
      align-self: start; font-weight: 600;
    }
    .sql-panel .run[disabled] { opacity: 0.5; cursor: progress; }
    .sql-panel .run:hover:not([disabled]) { filter: brightness(1.15); }
    .sql-panel .result {
      padding: 0 16px 12px;
      font-size: 11px; color: var(--text-dim);
      font-family: ui-monospace, monospace;
    }
    .sql-panel .result .meta { padding: 4px 0 8px; }
    .sql-panel .result .meta .ok { color: var(--ok); }
    .sql-panel .result .meta .err { color: var(--err); }
    .sql-panel .result table {
      width: 100%; border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border); border-radius: 6px;
      overflow: hidden;
    }
    .sql-panel .result th, .sql-panel .result td {
      padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis;
    }
    .sql-panel .result th {
      background: var(--panel-2); color: var(--text-dim);
      font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .sql-panel .result td.num { text-align: right; }
    .sql-panel .result tr:last-child td { border-bottom: none; }
    .sql-panel .result .null { color: var(--text-dim); font-style: italic; }
    .storage .btn-query {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 2px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    .storage .btn-query:hover { color: var(--text); border-color: var(--accent); }
    .storage .btn-query.active { color: var(--text); border-color: var(--accent); background: var(--panel-2); }

    .deployments { padding: 4px 0; }
    .deployment {
      display: grid;
      grid-template-columns: 80px 110px 1fr auto auto;
      gap: 12px; align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    .deployment:hover { background: var(--panel-2); }
    .deployment.selected { border-left-color: var(--accent); background: var(--panel-2); }
    .deployment .commit { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-dim); }
    .deployment .commit .sha { color: var(--text); }
    .deployment .ago { color: var(--text-dim); font-size: 12px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge.queued    { background: rgba(154, 161, 173, 0.15); color: var(--text-dim); }
    .badge.building  { background: rgba(91, 192, 222, 0.15); color: var(--building); }
    .badge.deploying { background: rgba(91, 192, 222, 0.15); color: var(--building); }
    .badge.ready     { background: rgba(46, 204, 113, 0.15); color: var(--ok); }
    .badge.failed    { background: rgba(255, 107, 107, 0.15); color: var(--err); }
    .badge.cancelled { background: rgba(154, 161, 173, 0.15); color: var(--text-dim); }
    .url-link { font-size: 12px; }
    .empty {
      color: var(--text-dim); font-style: italic; padding: 12px 16px;
    }
    /* Logs pane: small, anchored to the bottom of the aside. */
    .logs-pane {
      flex: 0 0 240px;
      display: flex; flex-direction: column;
      border-top: 1px solid var(--border);
      background: #0e1116;
    }
    .log-head {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .log-head .title  { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
    .log-head .commit { font-family: ui-monospace, monospace; color: var(--text); font-size: 11px; }
    .log-head .spacer { flex: 1; }
    .log-head button, .log-head a {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 2px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; text-decoration: none;
    }
    .log-head button:hover, .log-head a:hover { color: var(--text); border-color: var(--accent); }
    .log-body {
      flex: 1; overflow-y: auto;
      padding: 8px 14px;
      font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    .log-line { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
    .log-line .c { color: var(--text-dim); font-weight: 600; user-select: none; }
    .log-line.kaniko .c { color: var(--building); }
    .log-line.clone  .c { color: #b48ead; }
    .log-line.system .c { color: var(--warn); }
    .log-placeholder {
      color: var(--text-dim); font-style: italic; padding: 16px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>paas</h1>
      <span class="meta" id="meta">loading…</span>
      <span class="spacer"></span>
      <span class="me" id="me"></span>
      <button class="signout" id="signout">Sign out</button>
    </header>
    <main id="projects"><div class="empty">Loading projects…</div></main>
    <aside>
      <!-- Empty state: shown when no project is selected. -->
      <div class="ws-empty" id="ws-empty">
        Select a project to manage its database and view build logs.
      </div>
      <!-- Active workspace: storage + SQL editor for the selected project. -->
      <div class="ws" id="ws">
        <div class="ws-head">
          <span class="slug" id="ws-slug"></span>
          <span class="repo" id="ws-repo"></span>
          <span class="spacer"></span>
          <button id="ws-close">close</button>
        </div>
        <div class="ws-storage" id="ws-storage">
          <span class="label">Storage</span><span>loading…</span>
        </div>
        <div class="ws-query" id="ws-query">
          <div class="editor">
            <textarea id="ws-sql" spellcheck="false" placeholder="-- Try:  SELECT now();"></textarea>
            <button class="run" id="ws-run">Run ⌘↵</button>
          </div>
          <div class="result" id="ws-result"></div>
        </div>
      </div>
      <!-- Compact logs pane. Always present; updates when a deployment row is clicked. -->
      <div class="logs-pane">
        <div class="log-head">
          <span class="title" id="log-title">Logs</span>
          <span class="commit" id="log-commit">— select a deployment</span>
          <span class="spacer"></span>
          <a id="log-url" target="_blank" rel="noopener" style="display:none">open ↗</a>
          <button id="log-close" style="display:none">close</button>
        </div>
        <div class="log-body" id="log-body">
          <div class="log-placeholder">Click a deployment row to stream its build logs here.</div>
        </div>
      </div>
    </aside>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const projectsEl = $('projects');
const logBody    = $('log-body');
const logTitle   = $('log-title');
const logCommit  = $('log-commit');
const logUrl     = $('log-url');
const logClose   = $('log-close');
const meta       = $('meta');

let currentES = null;
let selectedId = null;
// Per-project SQL console state preserved across refresh() re-renders.
// Without this the 10s background poll wipes the user's textarea +
// closes the panel mid-edit.
//   { open: bool, sql: string, resultHTML: string }
const sqlState = {};

function timeAgo(iso) {
  const t = new Date(iso).getTime();
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// Strip ANSI escape sequences. Kaniko emits a lot of these.
function stripAnsi(s) {
  return s.replace(/\u001b\[[0-9;]*[A-Za-z]/g, '');
}

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-store', credentials: 'same-origin' });
  if (r.status === 401) {
    window.location.href = '/login';
    throw new Error('unauthenticated');
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadMe() {
  try {
    const me = await fetchJSON('/v1/me');
    const el = document.getElementById('me');
    el.innerHTML = `${me.avatar_url ? `<img src="${me.avatar_url}" alt="">` : ''}<span>${escapeHTML(me.login)}</span>`;
  } catch (e) { /* loadMe runs after fetchJSON already redirects on 401 */ }
}

document.getElementById('signout').addEventListener('click', async () => {
  try { await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (_) {}
  window.location.href = '/login';
});

async function refresh() {
  try {
    const data = await fetchJSON('/v1/projects');
    render(data);
    const n = (data.projects || []).length;
    meta.textContent = (n === 1 ? '1 project' : n + ' projects') + ' · updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    if (e.message === 'unauthenticated') return;
    projectsEl.innerHTML = '<div class="empty">Failed to load projects: ' + escapeHTML(e.message) + '</div>';
  }
}

function render(data) {
  if (!data.projects.length) {
    projectsEl.innerHTML = `
      <div class="install-cta">
        <h3>Connect a GitHub repository</h3>
        <p>Install the paas GitHub App on a repository to get your first deployment. Push to its default branch and we'll build &amp; serve it.</p>
        <a class="btn" href="https://github.com/apps/jamilshaikh-paas-v2/installations/new" target="_blank" rel="noopener">Install GitHub App ↗</a>
      </div>`;
    return;
  }
  const html = data.projects.map(p => {
    const deps = (p.deployments || []);
    const depHTML = deps.length ? deps.map(d => `
      <div class="deployment" data-id="${d.id}" data-commit="${d.commit_sha}" data-status="${d.status}" data-url="${d.url || ''}">
        <span class="badge ${d.status}">${d.status}</span>
        <span class="commit"><span class="sha">${d.commit_sha.slice(0,8)}</span> · ${d.ref.replace('refs/heads/','')}</span>
        <span class="ago" title="${d.created_at}">${timeAgo(d.created_at)}</span>
        ${d.url ? `<a class="url-link" href="${d.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">open ↗</a>` : '<span></span>'}
        <span></span>
      </div>
    `).join('') : '<div class="empty">No deployments yet.</div>';

    // Production URL is live as soon as any deployment on the production
    // branch has reached ready — the prod-<slug> IngressRoute is in place.
    const prodRef = 'refs/heads/' + p.production_branch;
    const hasProd = deps.some(d => d.status === 'ready' && d.ref === prodRef);
    const prodHost = `${p.slug}.jamilshaikh.in`;
    const prodLink = hasProd
      ? `<a class="prod-link" href="https://${prodHost}" target="_blank" rel="noopener" title="Production alias">${prodHost} ↗</a>`
      : '';

    // The project's full payload is JSON-encoded into a data attribute
    // on the header so the click handler can hand it straight to the
    // workspace opener without another round-trip.
    const projJSON = escapeHTML(JSON.stringify(p));
    return `
      <div class="project" data-project-id="${p.id}">
        <div class="project-head" data-open-ws='${projJSON}' style="cursor:pointer">
          <span class="slug">${escapeHTML(p.slug)}</span>
          <span class="repo">${escapeHTML(p.full_name)}</span>
          ${prodLink}
          <span class="branch">${escapeHTML(p.production_branch)}</span>
        </div>
        <div class="deployments">${depHTML}</div>
      </div>
    `;
  }).join('');
  projectsEl.innerHTML = html;

  // Wire project-header clicks to open the per-project workspace on the right.
  projectsEl.querySelectorAll('.project-head').forEach(el => {
    el.addEventListener('click', () => {
      const p = JSON.parse(el.dataset.openWs);
      openWorkspace(p);
    });
  });

  // Re-highlight the previously-selected row, if it's still in the list.
  if (selectedId) {
    const el = projectsEl.querySelector(`.deployment[data-id="${selectedId}"]`);
    if (el) el.classList.add('selected');
  }

  projectsEl.querySelectorAll('.deployment').forEach(el => {
    el.addEventListener('click', () => openLogs(el));
  });
}

// === Workspace (right-pane) singletons ===
// One DOM workspace serves every project; switching is just a state swap.
const wsEmpty   = $('ws-empty');
const wsEl      = $('ws');
const wsSlug    = $('ws-slug');
const wsRepo    = $('ws-repo');
const wsStorage = $('ws-storage');
const wsQueryEl = $('ws-query');
const wsSql     = $('ws-sql');
const wsRun     = $('ws-run');
const wsResult  = $('ws-result');
const wsCloseBtn = $('ws-close');
let   wsProjectID = null;

// Snapshot the in-flight editor state for the currently-open project
// before swapping to a new one (or closing). Without this, the user's
// typed SQL is lost when switching projects or on the 10s poll.
function snapshotWorkspaceState() {
  if (!wsProjectID) return;
  sqlState[wsProjectID] = {
    sql: wsSql.value,
    resultHTML: wsResult.innerHTML,
  };
}

function openWorkspace(project) {
  if (wsProjectID === project.id) return; // already active
  snapshotWorkspaceState();

  wsProjectID = project.id;
  wsSlug.textContent = project.slug;
  wsRepo.textContent = project.full_name;
  wsEmpty.style.display = 'none';
  wsEl.classList.add('active');

  // Hide the query editor until storage is known to be provisioned.
  wsQueryEl.classList.remove('active');
  wsResult.innerHTML = '';

  // Restore SQL editor state for this project (if previously open).
  const saved = sqlState[project.id];
  wsSql.value = (saved && saved.sql) ? saved.sql : '';
  if (saved && saved.resultHTML) wsResult.innerHTML = saved.resultHTML;

  // Highlight the selected project card.
  projectsEl.querySelectorAll('.project').forEach(el => {
    el.classList.toggle('active', el.dataset.projectId === project.id);
  });

  loadStorage(project.id);
}

function closeWorkspace() {
  snapshotWorkspaceState();
  wsProjectID = null;
  wsEl.classList.remove('active');
  wsQueryEl.classList.remove('active');
  wsEmpty.style.display = '';
  projectsEl.querySelectorAll('.project.active').forEach(el => el.classList.remove('active'));
}
wsCloseBtn.addEventListener('click', closeWorkspace);

async function loadStorage(projectID) {
  wsStorage.innerHTML = `<span class="label">Storage</span><span>loading…</span>`;
  try {
    const r = await fetch('/v1/projects/' + projectID + '/database', {
      cache: 'no-store', credentials: 'same-origin',
    });
    if (r.status === 401) { window.location.href = '/login'; return; }
    if (projectID !== wsProjectID) return; // user switched away mid-flight
    if (!r.ok) {
      wsStorage.innerHTML = `<span class="label">Storage</span><span class="err">unavailable</span>`;
      return;
    }
    const data = await r.json();
    renderStorage(projectID, data.database);
  } catch (e) {
    if (projectID !== wsProjectID) return;
    wsStorage.innerHTML = `<span class="label">Storage</span><span class="err">${escapeHTML(String(e))}</span>`;
  }
}

function renderStorage(projectID, db) {
  if (!db) {
    wsStorage.innerHTML = `
      <span class="label">Storage</span>
      <button class="btn-add" data-add-db>+ Add Postgres</button>
      <span style="font-size:11px;">Connect a per-project Postgres database. The next deploy will receive <code>DATABASE_URL</code> as an env var.</span>
    `;
    wsStorage.querySelector('[data-add-db]').addEventListener('click', (ev) => {
      addDatabase(projectID, ev.currentTarget);
    });
    wsQueryEl.classList.remove('active');
    return;
  }
  // Provisioned. Show readable summary + Copy URI + Reveal password.
  wsStorage.innerHTML = `
    <span class="label">Postgres</span>
    <span class="pill">${escapeHTML(db.db_name)}</span>
    <span style="font-size:11px;">user <span class="pill">${escapeHTML(db.role_name)}</span></span>
    <span style="font-size:11px;">host <span class="pill">${escapeHTML(db.host)}:${db.port}</span></span>
    <span style="font-size:11px; color: var(--text-dim);">env: <code>DATABASE_URL</code></span>
    <button class="copy" data-copy-uri>Copy URI</button>
    <button class="reveal" data-reveal-pw>Reveal password</button>
    <span class="pill" data-pw-slot style="display:none;"></span>
  `;
  wsStorage.querySelector('[data-copy-uri]').addEventListener('click', async (ev) => {
    try {
      await navigator.clipboard.writeText(db.uri);
      ev.currentTarget.textContent = 'Copied ✓';
      setTimeout(() => { ev.currentTarget.textContent = 'Copy URI'; }, 1500);
    } catch (_) {
      ev.currentTarget.textContent = 'Copy failed';
    }
  });
  const pwBtn  = wsStorage.querySelector('[data-reveal-pw]');
  const pwSlot = wsStorage.querySelector('[data-pw-slot]');
  pwBtn.addEventListener('click', () => {
    if (pwSlot.style.display === 'none') {
      pwSlot.textContent = db.password;
      pwSlot.style.display = '';
      pwBtn.textContent = 'Hide';
    } else {
      pwSlot.style.display = 'none';
      pwSlot.textContent = '';
      pwBtn.textContent = 'Reveal password';
    }
  });

  // DB is live → show the SQL editor.
  wsQueryEl.classList.add('active');
}

// SQL run button + Cmd/Ctrl+Enter — wired ONCE since the workspace is a singleton.
wsRun.addEventListener('click', () => {
  if (wsProjectID) runQuery(wsProjectID, wsSql, wsRun, wsResult);
});
wsSql.addEventListener('keydown', (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') {
    ev.preventDefault();
    if (wsProjectID) runQuery(wsProjectID, wsSql, wsRun, wsResult);
  }
});
wsSql.addEventListener('input', () => {
  if (wsProjectID) sqlState[wsProjectID] = { ...(sqlState[wsProjectID] || {}), sql: wsSql.value };
});

async function addDatabase(projectID, btn) {
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Provisioning…';
  try {
    const r = await fetch('/v1/projects/' + projectID + '/database', {
      method: 'POST',
      cache: 'no-store', credentials: 'same-origin',
    });
    if (r.status === 401) { window.location.href = '/login'; return; }
    if (projectID !== wsProjectID) return;
    if (!r.ok) {
      const msg = await r.text();
      wsStorage.innerHTML = `<span class="label">Storage</span><span class="err">${escapeHTML(msg.trim() || 'failed')}</span>`;
      return;
    }
    const data = await r.json();
    renderStorage(projectID, data.database);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = original;
    alert('Database provisioning failed: ' + e);
  }
}

async function runQuery(projectID, ta, btn, resEl) {
  const sql = ta.value.trim();
  if (!sql) { ta.focus(); return; }
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = 'Running…';
  resEl.innerHTML = `<div class="meta">running…</div>`;
  try {
    const r = await fetch('/v1/projects/' + projectID + '/database/query', {
      method: 'POST',
      cache: 'no-store', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql }),
    });
    if (r.status === 401) { window.location.href = '/login'; return; }
    if (!r.ok) {
      const msg = await r.text();
      resEl.innerHTML = `<div class="meta"><span class="err">HTTP ${r.status}:</span> ${escapeHTML(msg.trim() || 'request failed')}</div>`;
      return;
    }
    const data = await r.json();
    renderQueryResult(resEl, data);
  } catch (e) {
    resEl.innerHTML = `<div class="meta"><span class="err">error:</span> ${escapeHTML(String(e))}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
    sqlState[projectID] = { ...(sqlState[projectID] || {}), resultHTML: resEl.innerHTML };
  }
}

function renderQueryResult(resEl, data) {
  if (data.error) {
    const e = data.error;
    let msg = e.message || 'query failed';
    if (e.code) msg = `[${e.code}] ${msg}`;
    let extra = '';
    if (e.detail)   extra += `\n  detail: ${e.detail}`;
    if (e.hint)     extra += `\n  hint: ${e.hint}`;
    if (e.position) extra += `\n  position: ${e.position}`;
    resEl.innerHTML = `<div class="meta"><span class="err">error:</span> ${escapeHTML(msg)}</div><pre style="margin:0;color:var(--text-dim);font-size:11px;">${escapeHTML(extra)}</pre>`;
    return;
  }
  const cmd  = data.command || '';
  const ms   = data.elapsed_ms || 0;
  const rows = data.rows || [];
  const cols = data.columns || [];

  const summary =
    cmd === 'SELECT'
      ? `${rows.length} row${rows.length === 1 ? '' : 's'}`
      : `${cmd} ${data.row_count || 0}`;
  const trunc = data.truncated ? ` <span class="err">(truncated at 1000)</span>` : '';

  let table = '';
  if (cols.length > 0) {
    const numTypes = new Set(['int', 'numeric']);
    const headers = cols.map(c => `<th>${escapeHTML(c.name)}<div style="font-weight:400;font-size:9px;color:var(--text-dim);margin-top:1px;">${escapeHTML(c.type || '')}</div></th>`).join('');
    const body = rows.map(r =>
      '<tr>' + r.map((v, i) => {
        const cls = numTypes.has(cols[i]?.type) ? 'num' : '';
        if (v === null || v === undefined) return `<td class="${cls}"><span class="null">NULL</span></td>`;
        const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return `<td class="${cls}" title="${escapeHTML(s)}">${escapeHTML(s)}</td>`;
      }).join('') + '</tr>'
    ).join('');
    table = `<table><thead><tr>${headers}</tr></thead><tbody>${body}</tbody></table>`;
  }
  resEl.innerHTML = `<div class="meta"><span class="ok">${summary}</span>${trunc} <span style="color:var(--text-dim);">· ${ms}ms</span></div>${table}`;
}

function openLogs(el) {
  const id     = el.dataset.id;
  const commit = el.dataset.commit;
  const url    = el.dataset.url;

  // Clicking a deployment also activates that project's workspace on
  // the right so DB + SQL are right there alongside the build logs.
  const projectEl = el.closest('.project');
  if (projectEl) {
    const headEl = projectEl.querySelector('.project-head');
    if (headEl && headEl.dataset.openWs) {
      openWorkspace(JSON.parse(headEl.dataset.openWs));
    }
  }

  // Mark selection.
  projectsEl.querySelectorAll('.deployment.selected').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  selectedId = id;

  // Reset panel.
  closeStream();
  logBody.innerHTML = '';
  logTitle.textContent = 'Logs';
  logCommit.textContent = commit.slice(0, 8) + ' · streaming…';
  if (url) {
    logUrl.textContent = 'open ↗';
    logUrl.href = url;
    logUrl.style.display = '';
  } else {
    logUrl.style.display = 'none';
  }
  logClose.style.display = '';

  const es = new EventSource('/v1/deployments/' + id + '/logs');
  currentES = es;

  es.addEventListener('status', (ev) => {
    const d = JSON.parse(ev.data);
    logCommit.textContent = commit.slice(0, 8) + ' · ' + d.status;
    if (d.url) { logUrl.textContent = 'open ↗'; logUrl.href = d.url; logUrl.style.display = ''; }
  });
  es.addEventListener('log', (ev) => {
    const d = JSON.parse(ev.data);
    appendLine(d.c, stripAnsi(d.m));
  });
  es.addEventListener('end', (ev) => {
    const d = JSON.parse(ev.data);
    logCommit.textContent = commit.slice(0, 8) + ' · ' + (d.status || 'ended');
    closeStream();
    refresh();
  });
  es.onerror = () => {
    appendLine('system', '[stream] connection closed');
    closeStream();
  };
}

function appendLine(container, msg) {
  const div = document.createElement('div');
  div.className = 'log-line ' + container;
  const c = document.createElement('span'); c.className = 'c'; c.textContent = container;
  const m = document.createElement('span'); m.textContent = msg;
  div.appendChild(c); div.appendChild(m);
  const nearBottom = logBody.scrollTop + logBody.clientHeight >= logBody.scrollHeight - 40;
  logBody.appendChild(div);
  if (nearBottom) logBody.scrollTop = logBody.scrollHeight;
}

function closeStream() {
  if (currentES) {
    currentES.close();
    currentES = null;
  }
}

logClose.addEventListener('click', () => {
  closeStream();
  selectedId = null;
  projectsEl.querySelectorAll('.deployment.selected').forEach(x => x.classList.remove('selected'));
  logTitle.textContent = 'Logs';
  logCommit.textContent = '— select a deployment';
  logUrl.style.display = 'none';
  logClose.style.display = 'none';
  logBody.innerHTML = '<div class="log-placeholder">Click a deployment row to stream its build logs here.</div>';
});

// Deep-link support: GitHub status check target_url is `/#d=<deployment-id>`.
// Auto-open that deployment's logs as soon as it shows up in the project list.
function deepLinkID() {
  const m = window.location.hash.match(/d=([0-9a-fA-F-]{36})/);
  return m ? m[1] : null;
}
let pendingDeepLink = deepLinkID();

const origRender = render;
render = function(data) {
  origRender(data);
  if (pendingDeepLink) {
    const el = projectsEl.querySelector(`.deployment[data-id="${pendingDeepLink}"]`);
    if (el) {
      el.scrollIntoView({ block: 'center' });
      openLogs(el);
      pendingDeepLink = null;
    }
  }
};

window.addEventListener('hashchange', () => {
  const id = deepLinkID();
  if (!id) return;
  const el = projectsEl.querySelector(`.deployment[data-id="${id}"]`);
  if (el) openLogs(el);
  else pendingDeepLink = id;
});

loadMe();
refresh();
// Background poll — every 10s when no live stream so the deployment list
// stays fresh after another browser (or webhook) triggers a build.
setInterval(() => {
  if (!currentES) refresh();
}, 10000);
</script>
</body>
</html>
