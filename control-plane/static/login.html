<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spinup — sign in</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23ededed' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M7 14 L16 5 L25 14'/><path d='M9 19 L23 19'/><path d='M11 23 L21 23' opacity='0.7'/><path d='M13 27 L19 27' opacity='0.4'/></svg>">
  <style>
    :root {
      --bg: #000000;
      --border: #2a2a2a;
      --text: #ededed;
      --muted: #a1a1a1;
      --accent: #ededed;
      --accent-fg: #000000;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      max-width: 440px; margin: 0 auto; padding: 80px 24px 40px;
      text-align: center;
    }
    .back {
      display: inline-block; margin-bottom: 40px; font-size: 13px; color: var(--muted);
    }
    .back:hover { color: var(--text); }
    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 20px; margin-bottom: 32px;
      color: var(--text);
    }
    .logo svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.5; }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 32px; font-size: 15px; }
    .signin {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 12px 22px; border-radius: 8px;
      background: var(--accent); color: var(--accent-fg);
      text-decoration: none; font-weight: 600; font-size: 15px;
      transition: transform 0.1s ease, opacity 0.1s;
    }
    .signin:hover { transform: translateY(-1px); opacity: 0.92; }
    .signin svg { width: 20px; height: 20px; }
    .note {
      margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);
      font-size: 13px; color: var(--muted);
    }
    .note a { color: var(--muted); }
    .note a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="{{MARKETING_BASE}}/">← Back to spinup.in</a>
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 14 L16 5 L25 14"/><path d="M9 19 L23 19"/>
        <path d="M11 23 L21 23" opacity="0.7"/><path d="M13 27 L19 27" opacity="0.4"/>
      </svg>
      spinup
    </div>
    <h1>Sign in to deploy</h1>
    <p class="sub">Use the GitHub account that was approved on the waitlist.</p>

    <a class="signin" href="{{APP_BASE}}/auth/login">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1.1 1.9 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.6 3.3-1.2 3.3-1.2.7 1.7.3 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/>
      </svg>
      Sign in with GitHub
    </a>

    <p class="note">Not on the list yet? <a href="{{MARKETING_BASE}}/login#waitlist">Join the waitlist</a></p>
  </div>
</body>
</html>
