<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spinup brandmark — square 1024x1024 with white background and the
  same chevron-stack glyph used by the dashboard sidebar and favicon
  (control-plane/static/dashboard.html). If you change the glyph here,
  mirror the geometry into the dashboard SVG and the favicon data URI
  so the three stay visually identical.

  Used as the GitHub App avatar (upload at:
    Settings > Developer settings > GitHub Apps > spinup-app > General
    > Display information > Logo)
  and any other place a square brand image is needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background is intentionally transparent so the red mark sits
       directly on whatever surface displays it (GitHub uses both light
       and dark backdrops). The mark itself still has a 12.5% safe-area
       margin so circular crops won't clip it. -->

  <!-- Mark: chevron-up + three descending bars, in Spinup red (#e11d48).
       The source 32x32 viewBox is centered on the canvas by scaling 24x
       (32*24 = 768) and translating by (1024-768)/2 = 128 on both axes,
       which leaves a 12.5% safe-area margin on every side — comfortably
       inside any circular crop GitHub applies. The transform list reads
       right-to-left in SVG: scale runs first, then translate. -->
  <g transform="translate(128 128) scale(24)"
     fill="none" stroke="#e11d48" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 14 L16 5 L25 14"/>
    <path d="M9 19 L23 19"/>
    <path d="M11 23 L21 23" opacity="0.7"/>
    <path d="M13 27 L19 27" opacity="0.4"/>
  </g>
</svg>
